[package]
name = "tines-runner-rs"
version = "0.1.0"
edition = "2024"
description = "An independent Rust runner for Tines assignments"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
